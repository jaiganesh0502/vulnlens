name: vulnlens_mobile
description: "VulnLens — Personalised Vulnerability Triage Standalone Offline Mobile Application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/vulnerabilities.csv
    - assets/data/profiles.json
    - assets/data/gold_set.csv
    - assets/images/vulnlens_logo.png
